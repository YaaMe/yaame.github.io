version: 2
updates:
  # GitHub Actions. These run in CI with access to the repository, and this is
  # where advisories land. Versions are pinned to a floating major tag, so
  # patches arrive on their own and Dependabot only opens a pull request for a
  # new major — a few times a year rather than weekly.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # All five come from the same publisher and move together.
      actions:
        patterns: ["*"]

  # npm. Not everything here runs only at build time: under the full profile,
  # Astro's server runtime, Fedify and Drizzle run inside the Worker and answer
  # requests from other servers.
  #
  # Security advisories are a separate, repository-level setting and are not
  # throttled by this schedule.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Everything in one pull request, so dependency updates land on main as
      # one commit signed by GitHub, not by the author.
      #
      # The cost: a grouped update that breaks the build does not say which
      # package broke it, and `git bisect` cannot narrow one commit. Read the
      # pull request and revert the lockfile.
      deps:
        patterns: ["*"]
