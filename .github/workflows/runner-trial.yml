name: Runner trial

# Builds and checks on the next runner image without deploying anything, so
# the image can be tried before the pinned workflows move to it. No secrets,
# no deploy step: a run here cannot change production.

on:
  push:
    branches: [ci/ubuntu-26]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        profile: [static, full]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install
      - run: make check
        env:
          BUILD_PROFILE: ${{ matrix.profile }}
