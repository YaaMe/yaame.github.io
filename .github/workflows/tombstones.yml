name: Tombstones

# Turn comments that reached git and were later withdrawn into tombstones, and
# open a pull request for a person to decide on.
#
# The runtime stops serving them the moment the Delete arrives, but it cannot
# write git. CI holds a git token and nothing else, which is the deliberate
# split — so the work happens here, and only as a proposal.
#
# Weekly is enough: the immediate half is the runtime's, and a few days here
# only affects the repository, where a person has to look anyway.

on:
  schedule:
    # Monday morning, off the hour: everyone writes 0, and that minute is the
    # most contended one in the schedule.
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tombstones
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install

      - name: Rewrite what has been withdrawn
        env:
          APPLY: "1"
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          CF_D1_ID: ${{ vars.CF_D1_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/wrangler-config.mjs >/dev/null
          node scripts/tombstone.mjs

      # Nothing to do means nothing happens. A weekly empty pull request is
      # worse than no reminder: after a few, the one with content in it is
      # ignored along with the rest.
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/content/comments; then
            echo "  nothing to tombstone"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A fixed branch, so one batch updates one pull request instead of
          # opening a new one every week.
          #
          # A bare --force, where the standing rule is never to use one. The
          # exception is narrow: nobody works on this branch. It is regenerated
          # from main on every run out of data held in D1, so losing it costs
          # one re-run.
          #
          # --force-with-lease is worse than useless here: the lease compares
          # against a remote-tracking ref, the checkout fetched only main, and
          # without that ref it fails closed with "stale info" — which has
          # nothing to do with anyone having touched the branch.
          #
          # The cost, stated: a tombstone edited by hand on this branch before
          # the merge is overwritten on the next run. Edit main instead.
          git switch -c comments/tombstones
          git add src/content/comments
          git commit -m "chore(comments): tombstone what has been withdrawn"
          git push --force origin comments/tombstones

          # Open pull requests, not any pull request. `gh pr view` finds closed
          # ones too, so after a single close this would never open another:
          # the branch still moves, no pull request appears, and the job
          # reports success.
          open=$(gh pr list --head comments/tombstones --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create \
              --base main --head comments/tombstones \
              --title "Comments withdrawn by their authors" \
              --body-file .github/tombstone-pr.md
          else
            echo "  an open pull request already exists; branch updated"
          fi
