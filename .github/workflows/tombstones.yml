name: Tombstones

# 把「已经进了 git 而后被要求删除」的评论改成墓碑，开一个 PR 交给人决定。
#
# 为什么要有这道弯：运行时收到 Delete 的那一刻就停止呈现了，但它改不了 git。
# 而 CI 有 git 令牌、没有别的权限——这个分隔是有意的，所以由这里来做，
# 且只是提议，不是合并。
#
# 一周一次就够：即时的那一半已经由运行时承担，这里慢几天只影响仓库，
# 而仓库那一步本来就要人看。

on:
  schedule:
    # 周一早上，不取整点——每个写 cron 的人都写 0，那一刻的调度最挤。
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tombstones
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install

      - name: Rewrite what has been withdrawn
        env:
          APPLY: "1"
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          CF_D1_ID: ${{ vars.CF_D1_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/wrangler-config.mjs >/dev/null
          node scripts/tombstone.mjs

      # 没有改动就什么都不做。空 PR 每周一个，比没有提醒更糟——几次之后
      # 就没人看了，真有内容的那次也一起被忽略。
      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/content/comments; then
            echo "  没有要立碑的"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 固定分支：同一批待办更新同一个 PR，而不是每周开一个新的。
          #
          # 裸 --force，而仓库的规矩是永远不用它。这里是例外，因为这个分支不是
          # 有人在上面工作的分支：它每次都从 main 重新生成同样的内容，内容本身
          # 来自数据库，丢了再跑一次就有。
          #
          # --force-with-lease 在这里不但没保护到什么，还坏事：租约要和远端跟踪
          # 引用比对，而 checkout 只拉了 main，没有那个引用时它失败关闭，报
          # "stale info" —— 和有没有人改过那个分支毫无关系。
          #
          # 代价说清楚：如果有人在合并前手动改了这个分支上的墓碑，下一次运行会
          # 把它冲掉。真要改，改在 main 上。
          git switch -c comments/tombstones
          git add src/content/comments
          git commit -m "chore(comments): tombstone what has been withdrawn"
          git push --force origin comments/tombstones

          # 「打开的」PR，不是「任何」PR。gh pr view 连已关闭的也找得到，于是一次
          # 关闭之后这里就再也不开新的了 —— 分支照常推，PR 永远不出现，而这个
          # job 报成功。
          open=$(gh pr list --head comments/tombstones --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create \
              --base main --head comments/tombstones \
              --title "Comments withdrawn by their authors" \
              --body-file .github/tombstone-pr.md
          else
            echo "  已有打开的 PR，分支已更新"
          fi
