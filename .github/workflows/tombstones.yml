name: Tombstones

# Turn comments that reached git and were later withdrawn into tombstones, and
# open a pull request for a person to decide on.
#
# The runtime stops serving them over ActivityPub the moment the Delete
# arrives. The blog pages are built from git, so they keep showing the text
# until this pull request is merged and the site deploys. The runtime holds no
# git token, so the work happens here, and only as a proposal.
#
# Weekly means a withdrawn comment can stay on the blog for up to a week, plus
# however long the pull request waits.

on:
  schedule:
    # Monday morning, off the hour: everyone writes 0, and that minute is the
    # most contended one in the schedule.
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tombstones
  cancel-in-progress: false

jobs:
  raise:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
      - run: make install

      - name: Rewrite what has been withdrawn
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          CF_D1_ID: ${{ vars.CF_D1_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_TARGET: cloudflare
        run: |
          make data
          open_ref=$(gh pr list --head comments/tombstones --state open --json headRefName --jq '.[0].headRefName // empty')
          if [ -n "$open_ref" ]; then
            git fetch origin "refs/heads/$open_ref:refs/remotes/origin/$open_ref"
            export TOMBSTONE_PR_REF="refs/remotes/origin/$open_ref"
          fi
          result=$(scripts/platform/$DEPLOY_TARGET/tombstone.sh --apply)
          printf '%s\n' "$result"
          if printf '%s\n' "$result" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            process.exit(JSON.parse(readFileSync(0, "utf8")).shouldWrite ? 0 : 1);
          '; then
            echo "should-write=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-write=false" >> "$GITHUB_OUTPUT"
            echo "  no tombstone changes"
            exit 0
          fi

      # Nothing to do means nothing happens. A weekly empty pull request is
      # worse than no reminder: after a few, the one with content in it is
      # ignored along with the rest.
      - name: Open or update the pull request
        if: steps.reconcile.outputs.should-write == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          promoted_comments_root=$(node --input-type=module -e 'import { promotedComments } from "./src/config/data.config.generated.mjs"; console.log(promotedComments.gitRoot)')
          if [ -d "$promoted_comments_root" ]; then
            git add -A -- "$promoted_comments_root"
          fi
          open=$(gh pr list --head comments/tombstones --state open --json number --jq 'length')
          if git diff --cached --quiet -- "$promoted_comments_root" && [ "$open" = "0" ]; then
            echo "  nothing to tombstone"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A fixed branch, so one batch updates one pull request instead of
          # opening a new one every week.
          #
          # This branch is regenerated from main on every run. It is a workflow
          # branch, so replacing it is expected; main is never force-pushed.
          # --force-with-lease fails closed in CI because checkout fetched only
          # main, leaving no remote-tracking ref for its lease to compare.
          git switch -c comments/tombstones
          if ! git diff --cached --quiet -- "$promoted_comments_root"; then
            git commit -m "chore(comments): tombstone what has been withdrawn"
          fi
          git push --force origin comments/tombstones

          # Open pull requests, not any pull request. `gh pr view` finds closed
          # ones too, so after a single close this would never open another:
          # the branch still moves, no pull request appears, and the job
          # reports success.
          open=$(gh pr list --head comments/tombstones --state open --json number --jq 'length')
          if [ "$open" = "0" ]; then
            gh pr create \
              --base main --head comments/tombstones \
              --title "Comments withdrawn by their authors" \
              --body-file .github/tombstone-pr.md
          else
            echo "  an open pull request already exists; branch updated"
          fi
