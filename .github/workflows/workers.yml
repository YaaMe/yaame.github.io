name: Deploy CF Workers

# The other half of Deploy. That workflow publishes the static profile to
# Pages; this one publishes the full profile — Astro's runtime and
# ActivityPub — to Cloudflare.
#
# It runs `make deploy` rather than a deploy action, so CI and a laptop take
# the same path. Two Workers are built from one source tree, and the Makefile
# is what ships them together.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel one in flight. Stopping between the two deploys leaves the site
# Worker on new code and the queue consumer on old, and every diagnostic then
# describes code that is not running.
concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install

      # `make deploy` runs `make check` first, under the full profile, then
      # ships the site Worker and then the queue consumer.
      - run: make deploy
        env:
          BUILD_PROFILE: full
          # Identifiers are variables; only the credential is a secret.
          # Masking an id buys nothing and makes every failure harder to read.
          #
          # A wrong CF_KV_ID does not fail: the Worker binds an empty namespace,
          # finds no followers, and new posts quietly reach nobody.
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          CF_D1_ID: ${{ vars.CF_D1_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Against what is actually serving, not against the build. Our own
      # output cannot show an omission, such as a field the other end reads and
      # we never send. Only checking against what the other end reads can.
      - name: Conformance
        run: make ap-check
