name: Workers

# The other half of Deploy. That workflow publishes the static profile to
# Pages; this one publishes the full profile — Astro's runtime and
# ActivityPub — to Cloudflare.
#
# It runs `make deploy` rather than a deploy action, so CI and a laptop take
# the same path. That matters here more than usual: two Workers are built from
# one source tree, and the Makefile is where they were made to ship together.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel one in flight. Stopping between the two deploys leaves the site
# Worker on new code and the queue consumer on old — the exact split that made
# three "successful" deploys change nothing that was running.
concurrency:
  group: workers
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: make install

      # `make deploy` runs the same checks as CI's other job, then ships the
      # site Worker and the queue consumer in that order.
      - run: make deploy
        env:
          BUILD_PROFILE: full
          # Identifiers are variables; only the credential is a secret.
          # Masking an id buys nothing and makes every failure harder to read.
          #
          # A wrong CF_KV_ID does not fail: the Worker binds an empty namespace,
          # finds no key pair, mints a fresh one, and the actor quietly becomes
          # a different identity to everyone following it.
          CF_KV_ID: ${{ vars.CF_KV_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Against what is actually serving, not against the build. Every defect
      # this catches was one our own output could not show us: a field the
      # consumer reads and we never sent, a collection advertised and not
      # answered, a representation refused to a client that accepts anything.
      # Inspecting our own responses cannot find an omission — only comparing
      # against what the other end reads can.
      - name: Conformance
        run: make ap-check
